services:
  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcity-gateway
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRATION=${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "${SPRING_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - smartcity-net

  ai-agent:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smartcity-ai-core
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-15}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - SPRING_BACKEND_URL=http://gateway-service:8080
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      gateway-service:
        condition: service_healthy
    networks:
      - smartcity-net

  web-ui:
    image: nginx:alpine
    container_name: smartcity-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/src:/usr/share/nginx/html/src:ro
      - ./frontend/styles:/usr/share/nginx/html/styles:ro
      - ./frontend/assets:/usr/share/nginx/html/assets:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway-service:
        condition: service_healthy
      ai-agent:
        condition: service_healthy
    networks:
      - smartcity-net

networks:
  smartcity-net:
    driver: bridge
