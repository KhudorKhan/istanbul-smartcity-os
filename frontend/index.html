<!DOCTYPE html>
<html lang="ru" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Istanbul Smart City • AI Operating System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body class="bg-gray-950 text-gray-100 flex flex-col h-full overflow-hidden font-sans relative">

  <!-- СЛОЙ ФОНА (z-0, клики отключены) -->
  <div class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none z-0">
    <video autoplay loop muted playsinline poster="./assets/istanbul-bosphorus.jpg" class="w-full h-full object-cover">
      <source src="./assets/istanbul-bosphorus.mp4" type="video/mp4">
    </video>
    <!-- Затемнение умеренное, чтобы видео просматривалось, но контраст текста сохранялся -->
    <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-[1px]"></div>
  </div>

  <!-- СЛОЙ ИНТЕРФЕЙСА (z-10, полностью интерактивен) -->
  <div class="relative z-10 flex flex-col h-full w-full">
    <!-- Шапка -->
    <header class="h-16 border-b border-white/10 bg-slate-900/70 backdrop-blur-md px-6 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold shadow-lg shadow-blue-500/30">
          <i data-lucide="compass" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="font-bold text-sm text-white">İstanbul SmartCity OS</div>
          <div class="text-[10px] text-emerald-400 font-mono flex items-center">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
            AI-First Platform • 2026 Live
          </div>
        </div>
      </div>
      <div class="flex items-center space-x-4 text-xs">
        <div class="bg-slate-800/80 border border-white/10 p-1 rounded-xl flex items-center space-x-1">
          <button id="langRuBtn" class="px-2.5 py-1 rounded-lg bg-blue-600 text-white font-medium transition">RU</button>
          <button id="langTrBtn" class="px-2.5 py-1 rounded-lg text-gray-400 hover:text-white transition">TR</button>
        </div>
      </div>
    </header>

    <!-- Основной контейнер чата и виджетов -->
    <main id="appContent" class="flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col justify-between max-w-5xl w-full mx-auto"></main>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
