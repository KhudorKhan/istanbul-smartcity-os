server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Force revalidation so a browser never mixes a new index.html with stale CSS/JS.
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/v1/payments/ {
        proxy_pass http://gateway-service:8080/api/v1/payments/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /api/v1/ai/ {
        proxy_pass http://ai-agent:8001/api/v1/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /actuator/ {
        proxy_pass http://gateway-service:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
